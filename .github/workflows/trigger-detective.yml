name: Trigger Detective

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Print triggering event
        run: |
          echo "Event that triggered this workflow: ${{ github.event_name }}"

      - name: Print push branch
        if: github.event_name == 'push'
        run: |
          echo "Branch pushed to: ${{ github.ref_name }}"

      - name: Print pull request branches
        if: github.event_name == 'pull_request'
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"

      - name: Complete detective work
        run: echo "Detective work complete"