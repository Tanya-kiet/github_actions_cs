name: Incident Switchboard

run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}{1}', inputs.severity == 'high' && 'HIGH' || inputs.severity == 'medium' && 'MEDIUM' || 'LOW', inputs.deep_scan && ' SCAN' || '') || format('Automatic Switchboard - {0}', github.event_name) }}

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      severity:
        type: choice
        options:
          - low
          - medium
          - high
        default: low
        required: true

      deep_scan:
        type: boolean
        default: false
        required: true

      skip_tests:
        type: boolean
        default: false
        required: true

      reason:
        type: string
        required: false

jobs:

  # ---------------- TRIAGE ----------------
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Basic information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "Run number: ${{ github.run_number }}"

      - name: Manual information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Severity: ${{ inputs.severity }}"
          echo "Deep scan: ${{ inputs.deep_scan }}"
          echo "Skip tests: ${{ inputs.skip_tests }}"
          echo "Reason: ${{ inputs.reason }}"

          if [ "${{ inputs.severity }}" = "low" ]; then
            echo "Low severity: standard response"
          elif [ "${{ inputs.severity }}" = "medium" ]; then
            echo "Medium severity: increased attention required"
          else
            echo "High severity: immediate response required"
          fi

      - name: Automatic information
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: echo "Automatic run; no reason was supplied"

  # ---------------- TESTS ----------------
  tests:
    needs: triage
    if: ${{ inputs.skip_tests != true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Run tests
        working-directory: app
        run: npm test

  # ---------------- SCAN ----------------
  scan:
    needs: triage
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deep_scan == true || inputs.severity == 'high' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create scan file
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEVERITY="${{ inputs.severity }}"
            DEEP_SCAN="${{ inputs.deep_scan }}"
          else
            SEVERITY="automatic"
            DEEP_SCAN="false"
          fi

          cat > scan.json <<EOF
          {
            "severity": "$SEVERITY",
            "deep_scan": "$DEEP_SCAN",
            "actor": "${{ github.actor }}",
            "run_number": "${{ github.run_number }}",
            "time": "$(date -u)"
          }
          EOF

      - name: Read scan values
        run: |
          echo "Severity: $(jq -r '.severity' scan.json)"
          echo "Actor: $(jq -r '.actor' scan.json)"

  # ---------------- REPORT ----------------
  report:
    needs: [tests, scan]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Report results
        run: |
          echo "Tests: ${{ needs.tests.result }}"
          echo "Scan: ${{ needs.scan.result }}"

          if [ "${{ needs.tests.result }}" = "failure" ] || [ "${{ needs.scan.result }}" = "failure" ]; then
            echo "Some switchboard checks failed"
          else
            echo "Everything that ran completed successfully"
          fi

          echo "Switchboard closed"