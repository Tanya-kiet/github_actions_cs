name: System Report

on: push

jobs:
  system-info:
    runs-on: ubuntu-latest
    steps:
      - name: Print system information
        run: |
          echo "OS: $(uname -s)"
          echo "Kernel: $(uname -r)"
          echo "Free disk space:"
          df -h /
          echo "Current date and time: $(date)"

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Display runner home directory
        run: tree -L 2 "$HOME"

  tool-check:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create report.json
        run: |
          cat > report.json <<'EOF'
          {
            "project": "System Report",
            "runner": "ubuntu-latest",
            "status": "success"
          }
          EOF

      - name: Read value using jq
        run: |
          echo "Project: $(jq -r '.project' report.json)"

      - name: Print tool versions
        run: |
          python3 --version
          git --version
          jq --version

      - name: Complete report
        run: echo "Report complete"